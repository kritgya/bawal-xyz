<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAWAL — chromatic chrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #b3b3b3;
    /* Match the reference's neutral grey environment */
    background-image:
      radial-gradient(ellipse at 50% 50%, #c4c4c4 0%, #989898 100%);
  }

  body { position: relative; cursor: crosshair; }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    z-index: 3;
  }

  .stage { position: absolute; inset: 0; }
  svg.main { display: block; width: 100%; height: 100%; }

  text {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    letter-spacing: -0.05em;
  }

  .hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 4;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #444;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 12px;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 4px;
    display: flex;
    gap: 16px;
  }
  .hud span strong { color: #111; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <svg class="main" id="svg" preserveAspectRatio="none" aria-label="BAWAL">
      <defs>
        <!--
          Mercury base — softer than mirror chrome. No sharp horizon.
          A smooth top-light → mid-grey → deep-shadow gradient.
          This is what you see in the corners of the reference image.
        -->
        <linearGradient id="mercury" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#e9ecef"/>
          <stop offset="35%"  stop-color="#9ba3ad"/>
          <stop offset="65%"  stop-color="#3a4150"/>
          <stop offset="100%" stop-color="#0c1019"/>
        </linearGradient>

        <!--
          The hotspot. Concentric stops mimic chromatic dispersion:
          white core → soft halo → yellow → red → cyan → blue → deep navy.
          The colored rings are tight (close offsets) which is what makes
          them read as refractive caustics, not ordinary glow.
        -->
        <radialGradient id="hotspot1" cx="50%" cy="50%" r="50%">
          <stop offset="0%"    stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="22%"   stop-color="#ffffff" stop-opacity="1"/>
          <stop offset="42%"   stop-color="#fff8c8" stop-opacity="0.95"/>
          <stop offset="50%"   stop-color="#ffd84d" stop-opacity="0.9"/>
          <stop offset="56%"   stop-color="#ff5a3c" stop-opacity="0.85"/>
          <stop offset="62%"   stop-color="#7a2cff" stop-opacity="0.7"/>
          <stop offset="68%"   stop-color="#1aa8ff" stop-opacity="0.7"/>
          <stop offset="74%"   stop-color="#0c1f6e" stop-opacity="0.85"/>
          <stop offset="82%"   stop-color="#05060f" stop-opacity="0.6"/>
          <stop offset="100%"  stop-color="#05060f" stop-opacity="0"/>
        </radialGradient>

        <!--
          Secondary hotspot — slightly cooler, smaller. Two lights make
          the metal feel three-dimensional. This is what the reference
          has in the lower-left, dimmer than the primary.
        -->
        <radialGradient id="hotspot2" cx="50%" cy="50%" r="50%">
          <stop offset="0%"    stop-color="#ffffff" stop-opacity="0.9"/>
          <stop offset="25%"   stop-color="#e8eef5" stop-opacity="0.7"/>
          <stop offset="45%"   stop-color="#ff7a3c" stop-opacity="0.55"/>
          <stop offset="55%"   stop-color="#1aa8ff" stop-opacity="0.5"/>
          <stop offset="68%"   stop-color="#0c1f6e" stop-opacity="0.7"/>
          <stop offset="82%"   stop-color="#05060f" stop-opacity="0.4"/>
          <stop offset="100%"  stop-color="#05060f" stop-opacity="0"/>
        </radialGradient>

        <!-- deep shadow vignette to push the dark areas darker -->
        <radialGradient id="darkSink" cx="50%" cy="50%" r="70%">
          <stop offset="0%"   stop-color="#05060f" stop-opacity="0"/>
          <stop offset="100%" stop-color="#05060f" stop-opacity="0.55"/>
        </radialGradient>

        <!--
          Mask of the letterforms. All the chrome layers paint into this
          mask so they only show inside the text. Text shape never changes.
        -->
        <mask id="textMask">
          <rect width="100%" height="100%" fill="#000"/>
          <text
            id="textMaskText"
            x="50%" y="50%"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#fff"></text>
        </mask>

        <!-- subtle blur for the hotspots so the rings stay soft -->
        <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.4"/>
        </filter>
      </defs>

      <!-- 
        All chrome layers live inside this group, masked by the text.
        Order matters: base → dark sink → hotspots → final text outline.
      -->
      <g mask="url(#textMask)">
        <!-- 1. mercury base fills the entire viewport (will be clipped to letters by mask) -->
        <rect width="100%" height="100%" fill="url(#mercury)"/>

        <!-- 2. dark sink to deepen shadows -->
        <rect width="100%" height="100%" fill="url(#darkSink)"/>

        <!-- 3. cursor-tracked primary hotspot -->
        <circle id="hot1" r="0" fill="url(#hotspot1)" filter="url(#softBlur)"/>

        <!-- 4. trailing secondary hotspot -->
        <circle id="hot2" r="0" fill="url(#hotspot2)" filter="url(#softBlur)"/>
      </g>

      <!--
        Letter outline overlay — a hairline stroke on top, very subtle.
        This sharpens the letter edges that would otherwise feel mushy
        from all the soft gradients underneath.
      -->
      <text
        id="textOutline"
        x="50%" y="50%"
        text-anchor="middle"
        dominant-baseline="central"
        fill="none"
        stroke="#000"
        stroke-opacity="0.22"
        stroke-width="0.4"></text>
    </svg>
  </div>

  <div class="hud">
    <span>ratio <strong id="ratio">—</strong></span>
    <span>scale <strong id="scale">—</strong></span>
    <span>word <strong id="word">—</strong></span>
  </div>

<script>
  const BASELINE_RATIO = 3 / 2;
  // 100–119% → BAWAL, 120–139% → BAWAAL, +20% per A

  const svg          = document.getElementById('svg');
  const textMaskText = document.getElementById('textMaskText');
  const textOutline  = document.getElementById('textOutline');
  const hot1         = document.getElementById('hot1');
  const hot2         = document.getElementById('hot2');

  const $ratio = document.getElementById('ratio');
  const $scale = document.getElementById('scale');
  const $word  = document.getElementById('word');

  let vbWidth = 500, vbHeight = 100;

  function update() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = w / h;
    const scalePercent = (ratio / BASELINE_RATIO) * 100;
    const extraAs = Math.max(0, Math.floor((scalePercent - 100) / 20));
    const word = 'BAW' + 'A'.repeat(1 + extraAs) + 'L';

    vbWidth  = word.length * 100;
    vbHeight = 100;
    svg.setAttribute('viewBox', `0 0 ${vbWidth} ${vbHeight}`);

    [textMaskText, textOutline].forEach(el => {
      el.setAttribute('font-size', vbHeight);
      el.setAttribute('textLength', vbWidth);
      el.setAttribute('lengthAdjust', 'spacingAndGlyphs');
      el.textContent = word;
    });

    $ratio.textContent = ratio.toFixed(2) + ':1';
    $scale.textContent = scalePercent.toFixed(0) + '%';
    $word.textContent  = word;
  }
  update();
  window.addEventListener('resize', update);

  // -------- Cursor-tracked hotspots --------
  // Primary hotspot follows the cursor closely; secondary trails behind
  // and offset, like a second reflection from a different light.

  let cursorX = vbWidth * 0.7;   // initial idle position
  let cursorY = vbHeight * 0.4;
  let targetX = cursorX;
  let targetY = cursorY;
  let active  = 0.6;             // start visible even before mouse move
  let targetActive = 0.6;

  // Slow drift when idle so the hotspots breathe
  let driftT = 0;

  function clientToSvg(x, y) {
    const rect = svg.getBoundingClientRect();
    const sx = (x - rect.left) / rect.width  * vbWidth;
    const sy = (y - rect.top)  / rect.height * vbHeight;
    return [sx, sy];
  }

  window.addEventListener('mousemove', (e) => {
    const [sx, sy] = clientToSvg(e.clientX, e.clientY);
    targetX = sx;
    targetY = sy;
    targetActive = 1;
  });
  window.addEventListener('mouseleave', () => { targetActive = 0.5; });

  function tick() {
    driftT += 0.008;

    // When idle (no mouse), the targets slowly drift in a Lissajous figure
    // so the metal looks "alive" but unhurried.
    if (targetActive < 0.7) {
      targetX = vbWidth  * (0.5 + 0.25 * Math.sin(driftT));
      targetY = vbHeight * (0.5 + 0.30 * Math.cos(driftT * 0.8));
    }

    cursorX += (targetX - cursorX) * 0.12;
    cursorY += (targetY - cursorY) * 0.12;
    active  += (targetActive - active) * 0.05;

    // Primary hotspot — sized relative to text height so it scales with viewport
    const r1 = vbHeight * 0.65 * (0.7 + 0.3 * active);
    hot1.setAttribute('cx', cursorX);
    hot1.setAttribute('cy', cursorY);
    hot1.setAttribute('r',  r1);

    // Secondary — smaller, offset, lags slightly. The offset direction
    // creates the "two light sources" feel from the reference.
    const r2 = vbHeight * 0.45;
    const offsetX = -vbWidth  * 0.15;
    const offsetY =  vbHeight * 0.15;
    hot2.setAttribute('cx', cursorX + offsetX);
    hot2.setAttribute('cy', cursorY + offsetY);
    hot2.setAttribute('r',  r2);

    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
