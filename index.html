<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAWAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #0a0a0a;
    background-image: radial-gradient(ellipse at 50% 50%, #141414 0%, #050505 100%);
  }
 
  body { position: relative; }
 
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    z-index: 3;
  }
 
  .stage { position: absolute; inset: 0; }
  svg { display: block; width: 100%; height: 100%; }
 
  text {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    fill: #f4ede0;
    letter-spacing: -0.05em;
  }
 
  .hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 4;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 12px;
    border: 1px solid #1f1f1f;
    border-radius: 4px;
    display: flex;
    gap: 16px;
  }
  .hud span strong { color: #f4ede0; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <svg id="svg" preserveAspectRatio="none" aria-label="BAWAL">
      <text id="text" x="50%" y="50%" text-anchor="middle" dominant-baseline="central"></text>
    </svg>
  </div>
 
  <div class="hud">
    <span>ratio <strong id="ratio">—</strong></span>
    <span>scale <strong id="scale">—</strong></span>
    <span>word <strong id="word">—</strong></span>
  </div>
 
<script>
  // Baseline: BAWAL fits a 3:2 box (width:height). That's our 100%.
  const BASELINE_RATIO = 3 / 2;
 
  // 100–119% → 0 extra A → BAWAL
  // 120–139% → 1 extra A → BAWAAL
  // 140–159% → 2 extra A → BAWAAAL
  // ...
  // Formula: extras = floor((scalePercent - 100) / 20), clamped >= 0
 
  const svg  = document.getElementById('svg');
  const text = document.getElementById('text');
  const $ratio = document.getElementById('ratio');
  const $scale = document.getElementById('scale');
  const $word  = document.getElementById('word');
 
  function update() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ratio = w / h;
    const scalePercent = (ratio / BASELINE_RATIO) * 100;
    const extraAs = Math.max(0, Math.floor((scalePercent - 100) / 20));
    const word = 'BAW' + 'A'.repeat(1 + extraAs) + 'L';
 
    const vbWidth  = word.length * 100;
    const vbHeight = 100;
 
    svg.setAttribute('viewBox', `0 0 ${vbWidth} ${vbHeight}`);
    text.setAttribute('font-size', vbHeight);
    text.setAttribute('textLength', vbWidth);
    text.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    text.textContent = word;
 
    $ratio.textContent = ratio.toFixed(2) + ':1';
    $scale.textContent = scalePercent.toFixed(0) + '%';
    $word.textContent  = word;
  }
 
  update();
  window.addEventListener('resize', update);
</script>
</body>
</html>
