<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rack — A Vinyl Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#211D1A; --bg2:#2A251F; --ink:#F2EBDD; --muted:#9C9083;
  --line:rgba(242,235,221,.12);
  --brass-hi:#F7DD9B; --brass-mid:#D9A84E; --brass-lo:#8A5D1E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --deva:'Tiro Devanagari Hindi',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-40vmax;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 120%,transparent 0 7px,rgba(255,255,255,.012) 7px 8px)}

.topbar{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;gap:14px;padding:16px 20px}
.toggle{display:flex;background:rgba(242,235,221,.06);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{appearance:none;border:0;background:transparent;color:var(--muted);width:40px;height:34px;display:grid;place-items:center;cursor:pointer}
.toggle button.active{background:var(--brass-mid);color:#1c1916}
.toggle button:focus-visible{outline:2px solid var(--brass-mid);outline-offset:-2px}
.wordmark{margin-left:auto;text-align:right;line-height:1.12;user-select:none}
.wordmark .en{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.04em}
.wordmark .dv{font-family:var(--deva);font-size:11px;color:var(--muted);letter-spacing:.16em}

.filters{position:fixed;top:60px;left:0;right:0;z-index:80;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
.filters button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--ink);border-color:rgba(242,235,221,.3)}
.filters button.on{color:#1c1916;background:var(--brass-mid);border-color:var(--brass-mid)}
.filters button:focus-visible{outline:2px solid var(--brass-mid);outline-offset:2px}

.stage{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 44%}
.card{position:absolute;left:50%;top:42%;width:min(38vmin,400px);aspect-ratio:1;transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.22,.9,.24,1),opacity .5s ease,filter .65s ease;cursor:pointer;will-change:transform}
.sleeve{position:absolute;inset:0;border-radius:3px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.4);background:#15110e;z-index:2}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.sleeve svg{display:block;width:100%;height:100%}
.disc{position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 35% 32%,rgba(255,255,255,.16),transparent 38%),
  repeating-radial-gradient(circle,#161412 0 1.6px,#211d1a 1.6px 3.2px);
  box-shadow:0 18px 40px rgba(0,0,0,.5);transform:translateX(0);
  transition:transform .7s cubic-bezier(.22,.9,.24,1)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:4.5%;height:4.5%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg)}
.disc .lbl{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;
  display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:600;
  font-size:clamp(6px,1vmin,9px);letter-spacing:.1em;line-height:1.4;padding:7%}
/* resting: just a sliver of the record peeks out */
.card.is-current .disc{transform:translateX(16%)}
/* hover: reveal more */
.card.is-current:hover .disc{transform:translateX(40%)}
@media (prefers-reduced-motion:reduce){.card,.disc{transition:none}}

.meta{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);z-index:60;text-align:center;max-width:min(620px,86vw)}
.meta .title{font-family:var(--serif);font-weight:600;font-size:clamp(22px,3.4vmin,36px);letter-spacing:.01em;line-height:1.12}
.meta .artist{color:var(--muted);font-size:clamp(13px,1.8vmin,17px);margin-top:4px}
.meta .tag{margin-top:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-mid)}
.meta .mnote{margin-top:12px;font-family:var(--serif);font-weight:500;
  font-size:clamp(16px,2.1vmin,21px);line-height:1.45;color:var(--ink);opacity:.92}
.meta .more{color:var(--brass-mid);cursor:pointer;white-space:nowrap}
.meta .more:hover{color:var(--brass-hi)}
.meta>*{transition:opacity .3s ease}
.fading .meta>*{opacity:0}

.nav{position:fixed;top:42%;transform:translateY(-50%);z-index:70;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(242,235,221,.1);color:var(--ink);backdrop-filter:blur(6px);display:grid;place-items:center;transition:background .2s}
.nav:hover{background:rgba(242,235,221,.22)}
.nav:focus-visible{outline:2px solid var(--brass-mid)}
.nav.prev{left:24px}.nav.next{right:24px}
.nav:disabled{opacity:.25;cursor:default}
.nav svg{width:18px;height:18px}

.counter{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.counter b{color:var(--ink);font-weight:600}

.listview{position:fixed;inset:0;z-index:85;overflow-y:auto;background:var(--bg);padding:108px clamp(16px,6vw,120px) 80px;display:none}
.listview.open{display:block}
.listview h2{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vmin,38px);margin-bottom:4px}
.listview .sub{color:var(--muted);font-size:13px;margin-bottom:28px;letter-spacing:.05em}
.row{display:grid;grid-template-columns:54px 64px 1fr auto;gap:18px;align-items:center;padding:14px 6px;
  border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:1px solid var(--line)}
.row:hover{background:rgba(242,235,221,.04)}
.row .n{font-family:var(--serif);font-weight:700;font-size:28px;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.row .th{width:64px;height:64px;border-radius:2px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.45);background:#15110e}
.row .th img,.row .th svg{width:100%;height:100%;object-fit:cover;display:block}
.row .t{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.15}
.row .a{color:var(--muted);font-size:13px;margin-top:2px}
.row .g{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-mid);text-align:right;line-height:1.7}
@media(max-width:640px){
  .topbar{padding:12px 16px}
  .wordmark .en{font-size:15px}
  .filters{top:76px;gap:6px}
  .filters button{font-size:10px;padding:6px 11px;letter-spacing:.1em}
  .nav.prev{left:8px}.nav.next{right:8px}
  .nav{top:47%}
  .card{width:min(66vw,270px);top:47%}
  .meta{bottom:8%;max-width:90vw;width:90vw}
  .meta .title{font-size:21px;line-height:1.12}
  .meta .artist{font-size:14px}
  .meta .tag{margin-top:10px}
  .meta .mnote{font-size:15px;line-height:1.45;margin-top:8px}
  .row{grid-template-columns:34px 52px 1fr}.row .g{display:none}.row .n{font-size:20px}.row .th{width:52px;height:52px}
}

/* ---------- detail overlay ---------- */
.detail{position:fixed;inset:0;z-index:120;display:none;overflow-y:auto;
  background:var(--bg);opacity:0;transition:opacity .7s ease}
.detail.open{display:block;opacity:1}
/* during the open flight, the detail's own vinyl is hidden; the flying clone stands in */
#dVinyl{transition:opacity .3s ease}
.detail.flying #dVinyl{opacity:0}
.detail.flying .dinfo{opacity:0;transform:translateY(8px)}
.dinfo{transition:opacity .55s ease .45s,transform .55s ease .45s}
/* flying vinyl clone — fixed, animated via JS from card position to detail position */
.vinyl-flyer{position:fixed;z-index:200;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 36% 32%,rgba(255,255,255,.14),transparent 36%),
    repeating-radial-gradient(circle,#161412 0 1.7px,#221d1a 1.7px 3.4px);
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.45);
  transition:transform .9s cubic-bezier(.4,0,.15,1)}
.vinyl-flyer .flbl{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);
  border-radius:50%;display:grid;place-items:center;text-align:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.18);
  font-family:var(--serif);font-weight:600;font-size:clamp(8px,1.5vmin,12px);letter-spacing:.22em;opacity:.85}
.vinyl-flyer .fspindle{position:absolute;left:50%;top:50%;width:3.6%;height:3.6%;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
/* full-bleed album art, pushed to the far background */
.detail .artbg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
  filter:blur(44px) saturate(1.2) brightness(.62);transform:scale(1.18);
  opacity:0;transition:opacity .85s ease}
.detail.open .artbg{opacity:1}
.detail .artbg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,18,15,.32),rgba(20,18,15,.66))}
.detail .glow{position:fixed;inset:0;z-index:0;opacity:.4;filter:blur(90px) saturate(1.3);
  background:radial-gradient(60% 60% at 50% 30%,var(--accent,#6a5a44),transparent 70%)}
.detail .close{position:fixed;top:18px;right:20px;z-index:5;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(20,18,15,.4);color:var(--ink);backdrop-filter:blur(6px);display:grid;place-items:center}
.detail .close:hover{background:rgba(20,18,15,.65)}
.detail .close:focus-visible{outline:2px solid var(--brass-mid)}
.detail .dnav{position:fixed;top:18px;left:20px;z-index:5;display:flex;gap:8px}
.detail .dnav button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(20,18,15,.4);color:var(--ink);backdrop-filter:blur(6px);display:grid;place-items:center}
.detail .dnav button:hover{background:rgba(20,18,15,.65)}
.detail .dnav button:disabled{opacity:.25;cursor:default}
.dwrap{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:84px clamp(20px,5vw,48px) 80px;
  display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:clamp(28px,5vw,56px);align-items:start}
/* the disc itself is the hero now — a vinyl record that spins */
.dcover{position:relative;width:100%;aspect-ratio:1}
/* static disc shell: holds the drop-shadow and the fixed light glint */
.dvinyl{position:absolute;inset:0;border-radius:50%;
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 8px 22px rgba(0,0,0,.45)}
/* the grooves spin; nothing else does */
.dvinyl .grooves{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle,#161412 0 1.7px,#221d1a 1.7px 3.4px)}
.dvinyl.spinning .grooves{animation:dspin 16s linear infinite}
@keyframes dspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dvinyl.spinning .grooves{animation:none}}
/* fixed highlight — a light source that stays put while the record turns under it */
.dvinyl .sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 36% 32%,rgba(255,255,255,.15),transparent 38%)}
/* the album art sits as the record's center label */
.dvinyl .dlabel{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);z-index:2;
  border-radius:50%;overflow:hidden;display:grid;place-items:center;text-align:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.18)}
.dvinyl .dlabel .lbltext{font-family:var(--serif);font-weight:600;font-size:clamp(8px,1.5vmin,12px);
  letter-spacing:.22em;opacity:.85}
.dvinyl .spindle{position:absolute;left:50%;top:50%;width:3.6%;height:3.6%;transform:translate(-50%,-50%);z-index:3;
  border-radius:50%;background:var(--bg);z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.dinfo .dtitle{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4.4vmin,46px);line-height:1.08;letter-spacing:.01em}
.dinfo .dartist{color:var(--muted);font-size:clamp(14px,2vmin,18px);margin-top:6px}
.dinfo .dmeta{margin:18px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.dinfo .chip{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-mid);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:rgba(20,18,15,.3)}
.dnote{margin:22px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(18px,2.4vmin,23px);
  line-height:1.5;color:var(--ink);opacity:.95;max-width:46ch}
.dtracks{margin-top:30px;border-top:1px solid var(--line)}
.dtracks .th{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:16px 4px 10px}
.dtracks .side{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-mid);padding:18px 4px 6px;border-top:1px solid var(--line)}
.dtracks .side:first-of-type{border-top:0}
.trk{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:baseline;
  padding:11px 4px;border-top:1px solid var(--line);font-size:15px}
.trk .ti{color:var(--muted);font-variant-numeric:tabular-nums}
.trk .tn{font-family:var(--serif);font-size:18px}
.trk .td{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dtracks .note{padding:16px 4px;color:var(--muted);font-size:13px;line-height:1.6}
@media(max-width:720px){
  .dwrap{grid-template-columns:1fr;gap:0;padding:80px 20px 64px}
  .dcover{max-width:230px;margin:0 auto}
  .dinfo{text-align:center;margin-top:26px}
  .dinfo .dmeta{justify-content:center;margin-top:0}
  .dnote{margin:18px auto 0;text-align:center}
  .dtracks{margin-top:28px;text-align:left}
  .dtracks .th{text-align:center}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="toggle" role="tablist" aria-label="View">
    <button id="btnFlow" class="active" aria-label="Cover view" title="Cover view">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="5" width="12" height="14" rx="1.5"/><path d="M4 7v10M1.5 9v6"/></svg>
    </button>
    <button id="btnList" aria-label="List view" title="List view">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <div class="wordmark"><div class="en">The Rack</div><div class="dv">रैक</div></div>
</div>

<div class="filters" id="filters"></div>

<div class="stage" id="stage" aria-live="polite"></div>
<div class="meta" id="meta">
  <div class="title" id="mTitle"></div>
  <div class="artist" id="mArtist"></div>
  <div class="tag" id="mTag"></div>
  <p class="mnote" id="mNote"></p>
</div>

<button class="nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="counter" id="counter"></div>

<div class="listview" id="listview">
  <h2>The Rack</h2>
  <div class="sub" id="listsub"></div>
  <div id="rows"></div>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Album details">
  <div class="artbg" id="dArtBg"></div>
  <div class="glow" id="dGlow"></div>
  <div class="dnav">
    <button id="dPrev" aria-label="Previous album"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="dNext" aria-label="Next album"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <button class="close" id="dClose" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="dwrap">
    <div class="dcover" id="dCover">
      <div class="dvinyl" id="dVinyl"><div class="grooves"></div><div class="sheen"></div><div class="dlabel" id="dLabel"></div><div class="spindle"></div></div>
    </div>
    <div class="dinfo">
      <h1 class="dtitle" id="dTitle"></h1>
      <div class="dartist" id="dArtist"></div>
      <div class="dmeta" id="dChips"></div>
      <p class="dnote" id="dNote"></p>
      <div class="dtracks" id="dTracks"></div>
    </div>
  </div>
</div>

<script>
const ALBUMS = [{"title": "Ananda Shankar and his Music", "artist": "Ananda Shankar", "year": "1975", "genre": "fusion", "term": "Ananda Shankar and his Music", "motif": "rings", "pal": ["#464b52", "#7e8d95", "#75bbe3", "#749cad"], "art": "art/01-ananda-shankar-and-his-music.jpg", "tracks": {"A": ["Streets of Calcutta", "Cyrus", "The Lonely Rider", "The River", "Vidai (Parting)", "Back Home"], "B": ["Dawn", "Renunciation", "Dancing Drums"]}, "note": "A pioneer of fusion between East and West, Ananda Shankar laced the sitar through jazz, funk and rock with a feel that still sounds novel today. This album was a 1975 jazz-funk affair — timeless, and long since a much sought-after record for club DJs."}, {"title": "Kandisa", "artist": "Indian Ocean", "year": "2000", "genre": "fusion", "term": "Indian Ocean Kandisa", "motif": "grid", "pal": ["#8b8a76", "#7d7168", "#f3bfbf", "#f3a19a"], "art": "art/02-kandisa.jpg", "tracks": {"A": ["Kya Maloom", "Ma Rewa", "Leaving Home", "Hille Le"], "B": ["Khajuraho", "Kaun", "Kandisa"]}, "note": "Indian Ocean's breakthrough and the album that defined modern Indian fusion. The title track 'Kandisa' reworks a Syrian Christian hymn into a motivating anthem, and 'Ma Rewa' is a masterpiece that hits different on a riverside road."}, {"title": "Bismillah", "artist": "Peter Cat Recording Co.", "year": "2019", "genre": "fusion", "term": "Peter Cat Recording Co Bismillah", "motif": "lotus", "pal": ["#ddc6b6", "#d8bca7", "#ab9e8f", "#883545"], "art": "art/03-bismillah.jpg", "tracks": {"A": ["Where The Money Flows", "Floated By", "Soulless Friends", "Vishnu <3"], "B": ["Memory Box", "Freezing", "Heera"], "C": ["I'm This", "Remain In Me", "Shit I'm Dreaming"], "D": ["We'regettingmarried"]}, "note": "Delhi's Peter Cat Recording Co. at their most expansive — gypsy-jazz waltzes, ballroom disco and Sufi longing on one record. Best for a chill Sunday afternoon."}, {"title": "Junun", "artist": "Shye Ben Tzur, Jonny Greenwood & The Rajasthan Express", "year": "2015", "genre": "fusion", "term": "Junun Shye Ben Tzur", "motif": "sunburst", "pal": ["#d6d6b9", "#d4d3b0", "#d3d2a3", "#d1d2b6"], "art": "art/04-junun.jpg", "tracks": {"A": ["Junun", "Roked", "Hu"], "B": ["Chala Vahi Des", "Kalandar", "Eloah"], "C": ["Julus", "Allah Elohim", "Ahuvi"], "D": ["Azov", "Junun Brass", "There Are Birds In The Echo Chamber", "Modeh"]}, "note": "Recorded in a Jodhpur fort with Radiohead's Jonny Greenwood, Israeli composer Shye Ben Tzur and Rajasthani brass and qawwali players. That brass section absolutely kills!"}, {"title": "Night Song", "artist": "Nusrat Fateh Ali Khan & Michael Brook", "year": "1996", "genre": "classical", "term": "Nusrat Fateh Ali Khan Night Song", "motif": "horizon", "pal": ["#849199", "#f5777b", "#f5777a", "#85929a"], "art": "art/05-night-song.jpg", "tracks": {"A": ["My Heart, My Life", "Intoxicated", "Lament", "My Comfort Remains"], "B": ["Longing", "Sweet Pain", "Night Song", "Crest"]}, "note": "Nusrat's voice set against Michael Brook's ambient guitar textures — qawwali reimagined for a Western audience without losing its ecstatic core. A landmark of the world-music era."}, {"title": "Heer", "artist": "Abida Parveen", "year": "2008", "genre": "classical", "term": "Abida Parveen Heer", "motif": "arcs", "pal": ["#b6c894", "#b1cace", "#cae4bd", "#c3e0b7"], "note": "Abida Parveen channelling the Sufi poet Bulleh Shah and Waris Shah's Heer, set to Gulzar's sensibility. Raw, commanding, unmistakably hers."}, {"title": "Ghazals", "artist": "Begum Akhtar", "year": "1970", "genre": "classical", "term": "Begum Akhtar", "motif": "diamond", "pal": ["#41464f", "#3f434b", "#f1dd4c", "#ece48b"], "note": "Begum Akhtar, the Mallika-e-Ghazal — the voice that brought the ghazal from the courtesan's salon to the concert hall. Foundational to the entire form."}, {"title": "Nayyara Sings Faiz", "artist": "Nayyara Noor", "year": "1977", "genre": "classical", "term": "Nayyara Noor Faiz", "motif": "split", "pal": ["#d8d2bd", "#d7c e": "film", "term": "Dil Se Rahman", "motif": "sunburst", "pal": ["#2b3335", "#2b3033", "#272c2f", "#2c3134"], "note": "A.R. Rahman at his early peak — 'Chaiyya Chaiyya' on a moving train, Sufi-pop and Gulzar's lyrics. The soundtrack that announced a new sound for Hindi cinema."}, {"title": "Yaadon Ki Baaraat", "artist": "R. D. Burman", "year": "1973", "genre": "film", "term": "Yaadon Ki Baaraat", "motif": "split", "pal": ["#636c75", "#737d87", "#eae4cd", "#e6dfc5"], "note": "R.D. Burman's template-setting score for the masala film — the record where the modern Bollywood soundtrack arguably begins."}, {"title": "Baton Baton Mein", "artist": "R. D. Burman", "year": "1979", "genre": "film", "term": "Baton Baton Mein", "motif": "lotus", "pal": ["#e3dcbf", "#e3ddc3", "#e3ddc7", "#e3ddc5"], "note": "Pancham in breezy, jazz-inflected mode for a gentle romance. 'Suniye Kahiye' is the standout — RD's lighter touch."}, {"title": "Tapasya / Chitchor", "artist": "Ravindra Jain", "year": "1976", "genre": "film", "term": "Chitchor Ravindra Jain", "motif": "arcs", "pal": ["#eb9aab", "#ea99aa", "#f19eae", "#f197a9"], "note": "Ravindra Jain's gentle, classically grounded melodies for two mid-'70s films. Music that proved restraint could outsell spectacle."}, {"title": "Border", "artist": "Anu Malik", "year": "1997", "genre": "film", "term": "Border Anu Malik soundtrack", "motif": "diamond", "pal": ["#878370", "#837d71", "#807d6a", "#8d8b76"], "note": "Anu Malik's patriotic war-film score, anchored by 'Sandese Aate Hain' — one of the most enduring soldier's-letter songs in Hindi cinema."}, {"title": "Aar Paar", "artist": "O. P. Nayyar", "year": "1954", "genre": "film", "term": "Aar Paar O P Nayyar", "motif": "rings", "pal": ["#c98a9a", "#d5aaa6", "#c27985", "#c27581"], "note": "O.P. Nayyar's rhythmic, tonga-beat genius for Guru Dutt's 1954 noir. The sound of '50s Bombay at its most propulsive."}, {"title": "Disco Dancer", "artist": "Bappi Lahiri", "year": "1982", "genre": "film", "term": "Disco Dancer Bappi Lahiri", "motif": "sunburst", "pal": ["#e6dbbf", "#e5dabe", "#545d66", "#e4d9bd"], "note": "Bappi Lahiri's gold-chain disco that conquered India and the Soviet bloc alike. 'I Am a Disco Dancer' as pure, unembarrassed pop."}, {"title": "Disco Deewane", "artist": "Nazia Hassan & Zoheb Hassan", "year": "1981", "genre": "film", "term": "Nazia Hassan Disco Deewane", "motif": "horizon", "pal": ["#e8d9c2", "#e66d52", "#d5ae9b", "#c5b098"], "note": "Nazia and Zoheb Hassan with Biddu — the record that launched South Asian pop as its own genre, outside the film industry entirely."}, {"title": "Polydor Strikes Gold", "artist": "Various Artists", "year": "1975", "genre": "film", "term": "Polydor Strikes Gold", "motif": "grid", "pal": ["#d1bb6d", "#dccc91", "#dbcb90", "#d4be70"], "note": "A '70s label sampler — the format that put a spread of hits on one disc. A snapshot of an era's taste."}, {"title": "Abbey Road", "artist": "The Beatles", "year": "1969", "genre": "western", "term": "Abbey Road Beatles", "motif": "split", "pal": ["#c4e1f1", "#c5e2f2", "#c1e1f0", "#c2e2f1"], "note": "The Beatles' last recorded album and its side-two medley — the band dissolving in perfect harmony. The crossing itself became iconography."}, {"title": "The Dark Side of the Moon", "artist": "Pink Floyd", "year": "1973", "genre": "western", "term": "Dark Side of the Moon Pink Floyd", "motif": "rings", "pal": ["#6f7062", "#717264", "#707163", "#66685b"], "note": "Pink Floyd's meditation on time, money and madness, seamless from first heartbeat to last. One of the best-selling and most engineered records ever made."}, {"title": "Houses of the Holy", "artist": "Led Zeppelin", "year": "1973", "genre": "western", "term": "Houses of the Holy Led Zeppelin", "motif": "horizon", "pal": ["#c6bdad", "#c6b9a6", "#b5a38c", "#a09481"], "note": "Led Zeppelin stretching out — reggae, funk and orchestral pomp under Hipgnosis's eerie Giant's Causeway sleeve."}, {"title": "The Velvet Underground & Nico", "artist": "The Velvet Underground & Nico", "year": "1967", "genre": "western", "term": "Velvet Underground Nico", "motif": "lotus", "pal": ["#eaa20f", "#e9a40f", "#dca229", "#453a1e"], "note": "The Warhol banana. Sold poorly, then influenced everyone who heard it — the origin point for art-rock, punk and the avant-garde pop that followed."}, {"title": "A Night at the Opera", "artist": "Queen", "year": "1975", "genre": "western", "term": "Queen Night at the Opera", "motif": "diamond", "pal": ["#d2abb1", "#d1657b", "#cfb5c2", "#cfa950"], "note": "Queen's maximalist peak, home to 'Bohemian Rhapsody' — the most expensive single of its day and a track that broke every rule of radio."}, {"title": "Abraxas", "artist": "Santana", "year": "1970", "genre": "western", "term": "Santana Abraxas", "motif": "sunburst", "pal": ["#c8b69b", "#c8aba5", "#c3a59d", "#c2a597"], "note": "Santana welding blues-rock to Afro-Latin percussion — 'Black Magic Woman' into 'Oye Como Va.' The album that put Latin rock on the map."}, {"title": "Random Access Memories", "artist": "Daft Punk", "year": "2013", "genre": "western", "term": "Daft Punk Random Access Memories", "motif": "grid", "pal": ["#6e6755", "#6f6856", "#7a7766", "#6d6654"], "note": "Daft Punk trading samplers for live session legends to chase the warmth of '70s studio disco. A robot's love letter to analog."}, {"title": "Dire Straits", "artist": "Dire Straits", "year": "1978", "genre": "western", "term": "Dire Straits debut", "motif": "arcs", "pal": ["#222b32", "#3a3d42", "#2e3337", "#e2d9a3"], "note": "The debut with 'Sultans of Swing' — Knopfler's fingerpicked Stratocaster cutting against punk and disco with pure understatement. This is the audiophile Mobile Fidelity pressing."}, {"title": "Continuum", "artist": "John Mayer", "year": "2006", "genre": "western", "term": "John Mayer Continuum", "motif": "split", "pal": ["#777777"], "note": "John Mayer stepping fully into blues — 'Gravity,' 'Slow Dancing in a Burning Room.' The record where he stopped being a pop act."}, {"title": "Nat King Cole Sings", "artist": "Nat King Cole", "year": "1960", "genre": "western", "term": "Nat King Cole Sings", "motif": "horizon", "pal": ["#5c6052", "#5e6254", "#5b5f51", "#575b4d"], "note": "That impossibly smooth baritone in its natural element. Standards sung with a warmth no one has matched since."}];

const GENRES=[["all","All"],["classical","Classical & Ghazal"],["film","Film"],["fusion","Fusion & Indie"],["western","Western"]];
const GLABEL={classical:"Classical · Ghazal · Sufi",film:"Film Soundtrack",fusion:"Fusion · Indie",western:"Western"};

/* ---------- generated minimal sleeve (fallback) ---------- */
function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function motif(m,p){
  const b=p[1]||p[0], c=p[3]||'#F2ECDA', ink=p[2]||'#1c1410';
  switch(m){
    case "rings":{let r="";for(let i=7;i>0;i--)r+=`<circle cx="200" cy="178" r="${i*22}" fill="none" stroke="${i%2?b:c}" stroke-width="7" opacity="${.3+i*.09}"/>`;return r+`<circle cx="200" cy="178" r="14" fill="${b}"/>`}
    case "grid":{let r="";for(let y=0;y<6;y++)for(let x=0;x<6;x++){const big=(x+y)%3===0;r+=`<circle cx="${70+x*52}" cy="${60+y*52}" r="${big?15:6}" fill="${big?b:c}" opacity="${big?1:.5}"/>`}return r}
    case "arcs":{let r="";for(let i=5;i>0;i--)r+=`<circle cx="200" cy="430" r="${i*68}" fill="none" stroke="${i%2?b:c}" stroke-width="26" opacity="${.25+i*.12}"/>`;return r+`<circle cx="200" cy="430" r="56" fill="${b}"/>`}
    case "diamond":return `<rect x="115" y="115" width="170" height="170" fill="${b}" transform="rotate(45 200 200)"/><rect x="150" y="150" width="100" height="100" fill="${ink}" transform="rotate(45 200 200)"/><rect x="178" y="178" width="44" height="44" fill="${c}" transform="rotate(45 200 200)"/>`;
    case "sunburst":{let r="";for(let i=0;i<13;i++){const a=Math.PI*(i/12);r+=`<line x1="200" y1="430" x2="${200+460*Math.cos(a+Math.PI)}" y2="${430-460*Math.sin(a)}" stroke="${b}" stroke-width="9" opacity="${i%2?.9:.45}"/>`}return r+`<circle cx="200" cy="430" r="90" fill="${b}"/>`}
    case "lotus":{let r="";for(let i=0;i<7;i++){const a=-90+(i-3)*24;r+=`<ellipse cx="200" cy="230" rx="30" ry="105" fill="${i%2?b:c}" opacity="${i===3?1:.7}" transform="rotate(${a} 200 320)"/>`}return r+`<circle cx="200" cy="320" r="26" fill="${b}"/>`}
    case "split":return `<polygon points="0,0 400,0 0,400" fill="${b}"/><circle cx="118" cy="118" r="58" fill="${c}" opacity=".9"/><circle cx="282" cy="282" r="58" fill="${b}"/>`;
    case "horizon":return `<rect x="0" y="200" width="400" height="60" fill="${b}" opacity=".9"/><rect x="0" y="262" width="400" height="34" fill="${b}" opacity=".55"/><rect x="0" y="298" width="400" height="20" fill="${b}" opacity=".3"/><circle cx="200" cy="198" r="64" fill="${c}"/>`;
  }
  return "";
}
// relative luminance of a #hex color
function lum(hex){
  hex=(hex||'#777').replace('#',''); if(hex.length===3)hex=hex.split('').map(x=>x+x).join('');
  const v=[0,2,4].map(i=>{let c=parseInt(hex.substr(i,2),16)/255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});
  return .2126*v[0]+.7152*v[1]+.0722*v[2];
}
function genSleeve(a,bare){
  const p=a.pal, base=p[0]||'#5a544c';
  const dark=lum(base)<0.42;                 // is the artwork dark overall?
  const ink   = dark ? '#F4EEE1' : '#1A140E'; // text color guaranteed to contrast the scrim
  const scrim = dark ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.62)';
  const small=a.title.length>22;
  // bare = no title/artist panel (used in detail view, where the info block sits right below the cover)
  const panel = bare ? '' : `
    <rect x="0" y="296" width="400" height="104" fill="${scrim}"/>
    <text x="22" y="338" font-family="Cormorant Garamond,serif" font-weight="700" font-size="${small?22:30}" fill="${ink}">${esc(a.title.slice(0,30))}</text>
    <text x="22" y="362" font-family="Inter,sans-serif" font-size="11" letter-spacing="1.2" fill="${ink}" opacity=".85">${esc(a.artist.toUpperCase().slice(0,38))}</text>
    <text x="22" y="384" font-family="Inter,sans-serif" font-size="9.5" letter-spacing="2" fill="${ink}" opacity=".6">${a.year}</text>`;
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(a.title)} by ${esc(a.artist)}">
    <rect width="400" height="400" fill="${base}"/>${motif(a.motif,p)}
    <rect x="0" y="0" width="400" height="34" fill="${scrim}"/>
    <text x="22" y="22" font-family="Inter,sans-serif" font-size="11" letter-spacing="3" fill="${ink}">THE RACK</text>${panel}
  </svg>`;
}

/* ---------- client-side cover art fetch (iTunes) ---------- */
const artCache={};
async function fetchArt(a){
  if(a._art!==undefined) return a._art;
  if(a.art){ a._art=a.art; return a._art; }   // hardcoded local cover wins
  try{
    const u="https://itunes.apple.com/search?"+new URLSearchParams({term:a.term,entity:"album",limit:"3"});
    const r=await fetch(u);
    const d=await r.json();
    let pick=null;
    const want=a.artist.toLowerCase().split(/[ ,&]/)[0];
    for(const it of (d.results||[])){
      if((it.artistName||"").toLowerCase().includes(want)){pick=it;break}
    }
    if(!pick && d.results && d.results.length) pick=d.results[0];
    a._art = pick ? pick.artworkUrl100.replace("100x100bb","600x600bb") : null;
    if(pick){ a._collId=pick.collectionId; a._aaArtist=pick.artistName; a._aaTitle=pick.collectionName; a._genreApple=pick.primaryGenreName; a._trackCount=pick.trackCount; }
  }catch(e){ a._art=null; }
  return a._art;
}
// fetch tracklist for a given album (lazy, cached)
// normalized tracklist = array of side groups: [{side:"A"|null, tracks:[{n,name,ms}]}]
const trk=(name,n,ms)=>({n,name,ms:ms??null});
async function fetchTracks(a){
  if(a._tracks!==undefined) return a._tracks;
  if(a.tracks){                                   // hardcoded list wins
    if(Array.isArray(a.tracks))                   // flat array → single unlabelled side
      a._tracks=[{side:null,tracks:a.tracks.map((t,i)=>trk(t,i+1))}];
    else                                          // {A:[...],B:[...]} → labelled sides
      a._tracks=Object.entries(a.tracks).map(([side,list])=>({side,tracks:list.map((t,i)=>trk(t,i+1))}));
    return a._tracks;
  }
  await fetchArt(a);
  if(!a._collId){ a._tracks=null; return null; }
  try{
    const u="https://itunes.apple.com/lookup?"+new URLSearchParams({id:a._collId,entity:"song"});
    const r=await fetch(u); const d=await r.json();
    const flat=(d.results||[]).filter(x=>x.wrapperType==="track")
      .map(x=>trk(x.trackName,x.trackNumber,x.trackTimeMillis));
    a._tracks=flat.length?[{side:null,tracks:flat}]:[];
  }catch(e){ a._tracks=null; }
  return a._tracks;
}

/* ---------- flow ---------- */
const stage=document.getElementById("stage");
let view=ALBUMS.slice();         // filtered, ordered countdown (index 0 = highest rank number shown first)
let current=0, filter="all";
let detailOpen=false, detailReq=0;

function buildCards(){
  stage.innerHTML="";
  view.forEach((a,i)=>{
    const card=document.createElement("div");
    card.className="card";
    const lbg=a.pal[1]||a.pal[0]; const lc=lum(lbg)<0.45?'#F4EEE1':'#1A140E';
    card.innerHTML=`<div class="disc"><div class="lbl" style="background:${lbg};color:${lc}">THE RACK<br>${esc(a.title.toUpperCase().slice(0,20))}</div></div>
      <div class="sleeve" data-i="${i}">${genSleeve(a)}</div>`;
    card.addEventListener("click",()=>{ if(i===current) openDetailFromCard(i); else go(i); });
    stage.appendChild(card);
  });
  // lazy-load real art, swap in on success
  view.forEach((a,i)=>{
    fetchArt(a).then(url=>{
      if(!url) return;
      const sl=stage.querySelector(`.sleeve[data-i="${i}"]`);
      if(!sl) return;
      const img=new Image();
      img.onload=()=>{ sl.innerHTML=""; sl.appendChild(img); };
      img.onerror=()=>{};
      img.alt=a.title; img.src=url;
    });
  });
  cards=[...stage.children];
}
let cards=[];

function layoutCards(){
  cards.forEach((c,i)=>{
    const off=i-current, ao=Math.abs(off);
    c.classList.toggle("is-current",off===0);
    if(ao>3){c.style.opacity=0;c.style.pointerEvents="none";c.style.transform=`translate(-50%,-50%) translateX(${off>0?120:-120}vw)`;return}
    c.style.pointerEvents="auto";
    if(off===0){c.style.opacity=1;c.style.zIndex=50;c.style.filter="none";c.style.transform="translate(-50%,-50%) rotateY(0) scale(1)"}
    else{const dir=off>0?1:-1,x=dir*(34+(ao-1)*7),ry=-dir*38,s=.55-(ao-1)*.05;
      c.style.opacity=ao>2?0:1;c.style.zIndex=50-ao*10;c.style.filter="brightness(.55)";
      c.style.transform=`translate(-50%,-50%) translateX(${x}vw) translateZ(-${120+ao*60}px) rotateY(${ry}deg) scale(${s})`}
  });
}
function updateMeta(){
  const a=view[current];
  if(!a)return;
  mTitle.textContent=a.title;
  mArtist.textContent=a.artist;
  mTag.textContent=GLABEL[a.genre]+" · "+a.year;
  fillNote(a.note||"");
  prevBtn.disabled=current===0; nextBtn.disabled=current===view.length-1;
  counter.innerHTML=`<b>${current+1}</b> / ${view.length}`;
}
function layout(){ layoutCards(); updateMeta(); }
const mTitle=q("mTitle"),mArtist=q("mArtist"),mTag=q("mTag"),mNote=q("mNote"),prevBtn=q("prev"),nextBtn=q("next"),counter=q("counter");
// on mobile, fit the note to 2 lines and append an inline "… More" that opens the detail
function fillNote(text){
  mNote.textContent=text; mNote.onclick=null; mNote.style.cursor="";
  if(!text) return;
  const lh=parseFloat(getComputedStyle(mNote).lineHeight), maxH=lh*2+1;
  if(mNote.scrollHeight<=maxH) return;                                 // already fits two lines
  const words=text.split(" "), tail='… <span class="more">More</span>';
  const cut=n=>esc(words.slice(0,n).join(" ").replace(/[\s.,;:!?—-]+$/,""));  // drop trailing punctuation
  let lo=1,hi=words.length,best=1;
  while(lo<=hi){const mid=(lo+hi)>>1;
    mNote.innerHTML=cut(mid)+tail;
    if(mNote.scrollHeight<=maxH){best=mid;lo=mid+1}else{hi=mid-1}}
  mNote.innerHTML=cut(best)+tail;
  mNote.style.cursor="pointer";
  mNote.onclick=()=>openDetailFromCard(current);                       // whole note opens the detail
}
function q(id){return document.getElementById(id)}

function go(i){
  if(i<0||i>=view.length||i===current)return;
  current=i; layoutCards();                              // covers glide immediately
  document.body.classList.add("fading");                // meta cross-fades
  clearTimeout(go._a); clearTimeout(go._b);
  go._a=setTimeout(updateMeta,140);                     // swap text while faded
  go._b=setTimeout(()=>document.body.classList.remove("fading"),150);
}
prevBtn.onclick=()=>go(current-1); nextBtn.onclick=()=>go(current+1);
window.addEventListener("keydown",e=>{if(detailOpen||listview.classList.contains("open"))return;if(e.key==="ArrowLeft")go(current-1);if(e.key==="ArrowRight")go(current+1)});

let tx=null;
window.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
window.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>48)go(current+(dx<0?1:-1));tx=null},{passive:true});

let wl=false,wa=0,wi=null;
window.addEventListener("wheel",e=>{
  if(listview.classList.contains("open"))return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(wl)return; wa+=d; clearTimeout(wi); wi=setTimeout(()=>wa=0,140);
  if(Math.abs(wa)>50){go(current+(wa>0?1:-1));wa=0;wl=true;setTimeout(()=>wl=false,380)}
},{passive:true});

/* ---------- filters ---------- */
const filtersEl=q("filters");
GENRES.forEach(([g,label])=>{
  const b=document.createElement("button");
  b.textContent=label; b.dataset.g=g; if(g==="all")b.classList.add("on");
  b.onclick=()=>setFilter(g);
  filtersEl.appendChild(b);
});
function setFilter(g){
  filter=g; current=0;
  [...filtersEl.children].forEach(b=>b.classList.toggle("on",b.dataset.g===g));
  view = g==="all" ? ALBUMS.slice() : ALBUMS.filter(a=>a.genre===g);
  buildCards(); layout(); buildRows();
}

/* ---------- list ---------- */
const listview=q("listview"),rows=q("rows"),listsub=q("listsub");
function buildRows(){
  rows.innerHTML="";
  listsub.textContent=`${view.length} records${filter==="all"?"":" · "+GLABEL[filter]} · counted down · 33⅓ RPM`;
  view.forEach((a,i)=>{
    const r=document.createElement("div");
    r.className="row"; r.tabIndex=0;
    r.innerHTML=`<div class="n">${a._rank}</div><div class="th">${genSleeve(a)}</div>
      <div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}</div></div>
      <div class="g">${GLABEL[a.genre]}<br>${a.year}</div>`;
    fetchArt(a).then(url=>{if(!url)return;const th=r.querySelector(".th");const img=new Image();img.onload=()=>{th.innerHTML="";th.appendChild(img)};img.src=url});
    const open=()=>{setView("flow");openDetail(i)};
    r.onclick=open; r.onkeydown=e=>{if(e.key==="Enter")open()};
    rows.appendChild(r);
  });
}
const btnFlow=q("btnFlow"),btnList=q("btnList");
function setView(v){const list=v==="list";listview.classList.toggle("open",list);btnList.classList.toggle("active",list);btnFlow.classList.toggle("active",!list)}
btnFlow.onclick=()=>setView("flow"); btnList.onclick=()=>setView("list");

/* ---------- detail view ---------- */
const detail=q("detail"),dArtBg=q("dArtBg"),dLabel=q("dLabel"),dGlow=q("dGlow"),dTitle=q("dTitle"),dArtist=q("dArtist"),dChips=q("dChips"),
      dNote=q("dNote"),dTracks=q("dTracks"),dPrev=q("dPrev"),dNext=q("dNext"),
      dVinyl=q("dVinyl"),dCover=q("dCover");

function fmtDur(ms){if(!ms)return"";const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

/* animated open: the on-card disc flies forward into the detail's vinyl position,
   the sleeve recedes into the blurred background, then the real spinning vinyl takes over */
function openDetailFromCard(i){
  const card=cards[current]; const a=view[i];
  const disc=card&&card.querySelector(".disc");
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!disc||reduce){ openDetail(i); return; }

  const from=disc.getBoundingClientRect();

  // open the detail underneath, content populated, but keep its own vinyl hidden during flight
  openDetail(i,true);
  detail.classList.add("flying");

  const to=dVinyl.getBoundingClientRect();

  // flyer is sized to the DESTINATION and we scale it DOWN to the start — animating
  // transform (translate+scale) keeps everything on the compositor: smooth, no per-frame layout
  const lbg=a.pal[1]||a.pal[0]; const lc=lum(lbg)<0.45?'#F4EEE1':'#1A140E';
  const flyer=document.createElement("div");
  flyer.className="vinyl-flyer";
  flyer.style.left=to.left+"px"; flyer.style.top=to.top+"px";
  flyer.style.width=to.width+"px"; flyer.style.height=to.height+"px";
  flyer.innerHTML=`<div class="flbl" style="background:${lbg};color:${lc}">THE RACK</div><div class="fspindle"></div>`;
  document.body.appendChild(flyer);

  // start transform: place + scale so the flyer visually matches the small on-card disc
  const s0=from.width/to.width;
  const dx0=(from.left+from.width/2)-(to.left+to.width/2);
  const dy0=(from.top+from.height/2)-(to.top+to.height/2);
  flyer.style.transform=`translate(${dx0}px,${dy0}px) scale(${s0})`;

  // force a reflow so the start transform is committed before we transition to the end
  void flyer.offsetWidth;
  flyer.style.transform="translate(0,0) scale(1)";

  let flying=true;
  const done=()=>{
    if(!flying)return; flying=false;
    // reveal the real (still-static) vinyl underneath, perfectly aligned with the flyer
    dVinyl.classList.remove("spinning");
    detail.classList.remove("flying");        // dVinyl fades in (CSS), flyer fades out below
    flyer.style.transition="opacity .25s ease";
    flyer.style.opacity="0";
    setTimeout(()=>flyer.remove(),260);
    // once the disc has visually settled, let it begin turning from rest
    setTimeout(()=>{ if(detailOpen) dVinyl.classList.add("spinning"); },340);
  };
  flyer.addEventListener("transitionend",done,{once:true});
  setTimeout(()=>done(),1050);           // safety net if transitionend is missed
}

function openDetail(i,suppressFlightVinyl){
  current=i; const a=view[i]; if(!a)return;
  const req=++detailReq;
  detailOpen=true; detail.classList.add("open"); document.body.style.overflow="hidden";
  if(!suppressFlightVinyl){ detail.classList.remove("flying"); dVinyl.classList.add("spinning"); }
  else { dVinyl.classList.remove("spinning"); }

  // vinyl center is a plain record label (no album art); art goes to the section background
  const lbg=a.pal[1]||a.pal[0];
  const lc=lum(lbg)<0.45?'#F4EEE1':'#1A140E';
  dLabel.style.background=lbg;
  dLabel.style.color=lc;
  dLabel.innerHTML=`<span class="lbltext">THE RACK</span>`;
  dArtBg.style.backgroundImage="none";
  dArtBg.style.backgroundColor=a.pal[0]||"#221d1a";   // tinted fallback while art loads / if none
  dGlow.style.setProperty("--accent",a.pal[1]||a.pal[0]);
  dTitle.textContent=a.title;
  dArtist.textContent=a.artist;
  dChips.innerHTML=`<span class="chip">${GLABEL[a.genre]}</span><span class="chip">${a.year}</span>`;
  dNote.textContent=a.note||"";
  dTracks.innerHTML=`<div class="th">Tracklist</div><div class="note">Loading…</div>`;
  dPrev.disabled=i===0; dNext.disabled=i===view.length-1;

  // real art → fills ONLY the section background (the blurred wash behind everything)
  fetchArt(a).then(url=>{
    if(req!==detailReq)return;
    if(url){
      const img=new Image();
      img.onload=()=>{ if(req!==detailReq)return; dArtBg.style.backgroundImage=`url("${url}")`; };
      img.src=url;
    }
    if(a._genreApple)dChips.insertAdjacentHTML("beforeend",`<span class="chip">${esc(a._genreApple)}</span>`);
  });

  // tracklist
  fetchTracks(a).then(tracks=>{
    if(req!==detailReq)return;
    if(tracks&&tracks.length){
      const total=tracks.reduce((s,g)=>s+g.tracks.length,0);
      dTracks.innerHTML=`<div class="th">Tracklist · ${total} tracks</div>`+
        tracks.map(g=>(g.side?`<div class="side">Side ${g.side}</div>`:"")+
          g.tracks.map(t=>`<div class="trk"><span class="ti">${(g.side||"")+(t.n||"")}</span><span class="tn">${esc(t.name)}</span><span class="td">${fmtDur(t.ms)}</span></div>`).join("")
        ).join("");
    }else{
      dTracks.innerHTML=`<div class="th">Tracklist</div><div class="note">No catalog tracklist found for this pressing — common for older or regional Indian releases.</div>`;
    }
  });
}
function closeDetail(){detailOpen=false;detail.classList.remove("open");detail.classList.remove("flying");dVinyl.classList.remove("spinning");document.body.style.overflow="";layout();}
q("dClose").onclick=closeDetail;
detail.addEventListener("click",e=>{if(e.target===detail)closeDetail();});
dPrev.onclick=()=>{if(current>0)openDetail(current-1)};
dNext.onclick=()=>{if(current<view.length-1)openDetail(current+1)};
window.addEventListener("keydown",e=>{
  if(!detailOpen)return;
  if(e.key==="Escape")closeDetail();
  if(e.key==="ArrowLeft"&&current>0)openDetail(current-1);
  if(e.key==="ArrowRight"&&current<view.length-1)openDetail(current+1);
});

buildCards(); layout(); buildRows();
</script>
</body>
</html>
